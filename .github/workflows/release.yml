name: Release

# Builds the macOS and Windows packages and attaches them to a GitHub Release.
#
# Windows cannot be built from a Mac, so each package is produced on its own
# runner. Trigger by pushing a tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# or run it by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1 pytest==8.3.4 numpy==1.26.4 soundfile==0.14.0
      - name: Run the suite
        # The TTS engine is not installed here, so the tests that need it are
        # skipped; everything else must pass before anything is published.
        run: pytest -q -p no:warnings --ignore=tests/test_ui_threading.py -k "not kokoro"
        env:
          QT_QPA_PLATFORM: offscreen

  macos:
    name: macOS package
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          ./.venv/bin/python -m pip install PySide6==6.11.1
      - name: Build the app bundle
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh
      - name: Zip it
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Narration Studio.app" "NarrationStudio-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NarrationStudio-macOS
          path: dist/NarrationStudio-macOS.zip

  windows:
    name: Windows package
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the package
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NarrationStudio-Windows
          path: dist/NarrationStudio-Windows.zip

  publish:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — download `NarrationStudio-macOS.zip`, unzip, drag
            *Narration Studio.app* to Applications. Right-click ▸ Open the first
            time, because the app is not notarised.

            **Windows** — download `NarrationStudio-Windows.zip`, unzip anywhere,
            run `NarrationStudio.bat`.

            The first launch downloads the local speech engine (about 2 GB) and
            takes a few minutes. Every launch after that is immediate.

            **You also need [FFmpeg](https://ffmpeg.org/download.html)**:
            `brew install ffmpeg` on macOS, `winget install Gyan.FFmpeg` on Windows.
